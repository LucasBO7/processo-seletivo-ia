[project]
name = "startup-radar-backend"
version = "0.1.0"
description = "Fundação do backend do NVIDIA Startup AI Radar"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "cohere>=5.18,<6",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain-core>=0.3,<2",
  "langchain-groq>=0.3,<2",
  "langgraph>=0.6,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "qdrant-client>=1.15,<2",
  "rank-bm25>=0.2.2,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
startup-radar = "app.main:run"
startup-radar-check = "app.scripts:check"
startup-radar-knowledge = "app.cli.knowledge:run"
startup-radar-evaluate = "app.evaluation.cli:run"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
  "import-linter>=2.3,<3",
  "mypy>=1.17,<2",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cohere.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requer PostgreSQL e Qdrant reais",
  "external: requer rede ou provedor externo e habilitação explícita",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
